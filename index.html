<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Points Tracker</title>
<style>
:root {
  --bg:          #F5F2EE;
  --surface:     #ffffff;
  --border:      #E0DDD8;
  --text:        #1A1A1A;
  --muted:       #888;
  --red:         #E10600;

  --sprint-hdr:  #00695C;
  --sprint-bg:   #E8F5F0;
  --sprint-cell: #F0FAF8;
  --race-hdr:    #1A3A6B;
  --race-bg:     #E8F0FF;
  --total-hdr:   #2E7D32;
  --total-bg:    #E8F5E9;

  --font: 'Segoe UI', Calibri, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── toolbar ── */
.toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 18px;
  height: 46px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}

.toolbar-logo {
  background: var(--red);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  font-style: italic;
  letter-spacing: 0.05em;
  padding: 3px 9px 3px 8px;
  border-radius: 2px;
  flex-shrink: 0;
}

.toolbar-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text);
}

.toolbar-season {
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
  font-variant: small-caps;
  letter-spacing: 0.1em;
}

.toolbar select {
  font-family: var(--font);
  font-size: 12px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
}

.toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.toolbar button {
  font-family: var(--font);
  font-size: 12px;
  padding: 5px 14px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  transition: background 0.12s;
}
.toolbar button:hover { background: #EDE9E3; }

#status       { font-size: 11px; color: var(--muted); }
#status:empty { display: none; }
#status.error { color: var(--red); font-weight: 600; }

/* ── layout ── */
.page-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.drivers-panel {
  flex: 1;
  overflow: auto;
  padding: 10px 12px;
  scrollbar-width: thin;
  scrollbar-color: #CCC8C0 transparent;
}
.drivers-panel::-webkit-scrollbar { width: 5px; height: 5px; }
.drivers-panel::-webkit-scrollbar-track { background: transparent; }
.drivers-panel::-webkit-scrollbar-thumb { background: #CCC8C0; border-radius: 3px; }

/* ── constructors sidebar ── */
.sidebar {
  width: 300px;
  flex-shrink: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 12px 14px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.sidebar-header h2 {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.con-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 4px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--tc, #ccc);
  background: var(--surface);
  transition: background 0.1s;
}
.con-card:hover { background: #F5F2EE; }

.con-rank {
  font-size: 18px;
  font-weight: 700;
  color: var(--tc, #ccc);
  width: 22px;
  text-align: right;
  flex-shrink: 0;
  line-height: 1;
}

.con-info   { flex: 1; min-width: 0; }
.con-name   { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.con-max    { font-size: 11px; color: #999; margin-top: 2px; }

.con-pts-wrap { text-align: right; flex-shrink: 0; }
.con-pts      { font-size: 28px; font-weight: 700; line-height: 1; color: var(--text); }
.con-label    { font-size: 9px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }

/* ── drivers table ── */
table {
  border-collapse: collapse;
  white-space: nowrap;
  font-family: var(--font);
  font-size: 12px;
  background: var(--surface);
  box-shadow: 0 1px 6px rgba(0,0,0,0.04);
}

th, td {
  border: none;
  padding: 2px 5px;
  text-align: center;
  height: 22px;
  min-width: 28px;
}

tbody td { height: 38px; border-bottom: 1px solid #EEEBE5; }

thead th {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

/* sticky left 2 cols: team + driver */
td:nth-child(1), th:nth-child(1) { position: sticky; left: 0;     z-index: 8; background: inherit; min-width: 100px; text-align: left; }
td:nth-child(2), th:nth-child(2) { position: sticky; left: 100px; z-index: 8; background: inherit; min-width: 112px; text-align: left; }
td:nth-child(2) { border-right: 2px solid var(--border); }
th:nth-child(2) { border-right: 2px solid var(--border); }
thead th:nth-child(1), thead th:nth-child(2) { z-index: 22; background: var(--surface); }

/* date row above column labels */
.gh th {
  height: 18px; font-size: 10px; font-weight: 500;
}
.gh .blank { background: var(--surface) !important; color: transparent; }
.gh .sgrp  { background: var(--sprint-bg) !important; color: var(--sprint-hdr) !important; border-bottom: 1px solid var(--sprint-hdr) !important; }
.gh .rgrp  { background: var(--race-bg)   !important; color: var(--race-hdr)   !important; border-bottom: 1px solid var(--race-hdr)   !important; }
.gh .tgrp  { background: var(--total-bg)  !important; color: var(--total-hdr)  !important; }

/* col header row — only this row is sticky vertically */
.ch th {
  position: sticky; top: 0; z-index: 12; background: var(--surface);
  height: 28px; font-size: 11px; font-weight: 600; line-height: 1.25; padding: 3px 5px;
  font-variant: small-caps; letter-spacing: 0.08em; color: #888; overflow: hidden;
  border-bottom: 2px solid var(--border);
}
.ch .sh { background: var(--sprint-bg) !important; color: var(--sprint-hdr) !important; }
.ch .rh { background: var(--race-bg)   !important; color: var(--race-hdr)   !important; }
.ch .th { background: var(--total-bg)  !important; color: var(--total-hdr)  !important; font-weight: 700; }
.ch .ph { background: #F8F8F8 !important; color: var(--muted); }

/* data rows */
tbody tr { background: #FFFFFF; transition: background 0.15s; }
tbody tr:nth-child(even) { background: #FAF8F5; }
tbody tr:hover { background: #EFF5FF !important; }

/* de-emphasize zero-point rows */
tbody tr.zero-row .tc { color: #AAAAAA !important; }
tbody tr.zero-row .nc { color: #AAAAAA !important; font-weight: 400; }

.tc { text-align: left !important; font-size: 10px; color: #999; padding-left: 6px !important; text-transform: uppercase; letter-spacing: 0.1em; }
.nc { text-align: left !important; font-weight: 600; font-size: 12px; color: #1A1A1A; padding-left: 6px !important; }

/* podium race cells */
.p25 { background: #FFF8E1 !important; color: #B8860B !important; font-weight: 700; font-size: 13px; }
.p18 { background: #F5F5F5 !important; color: #708090 !important; font-weight: 700; font-size: 13px; }
.p15 { background: #FFF3E0 !important; color: #CD7F32 !important; font-weight: 700; font-size: 13px; }

/* other race cells — white bg, team color applied via inline style */
.p12, .p10, .p8, .p6, .p4, .p2, .p1 { background: #FFFFFF !important; font-weight: 600; font-size: 13px; }

/* sprint cells — top 3 get podium colors, rest plain */
.s8  { background: #FFF8E1 !important; color: #B8860B !important; font-weight: 700; font-size: 13px; }
.s7  { background: #F5F5F5 !important; color: #708090 !important; font-weight: 700; font-size: 13px; }
.s6  { background: #FFF3E0 !important; color: #CD7F32 !important; font-weight: 700; font-size: 13px; }
.s5, .s4, .s3, .s2c, .s1c { background: var(--sprint-cell) !important; font-weight: 600; font-size: 13px; }

.future    { background: var(--bg) !important; color: transparent; }
.cancelled { background: #F0F0F0 !important; color: #bbb; font-size: 9px; font-style: italic; }
.totcell   { background: var(--total-bg) !important; font-weight: 700; color: var(--total-hdr); min-width: 52px; font-size: 13px; }
.poscell   { background: #F8F8F8 !important; color: var(--muted); font-size: 11px; min-width: 52px; }

.sprint-td { min-width: 46px; }
.race-td   { min-width: 46px; }
</style>
</head>
<body>

<div class="toolbar">
  <span class="toolbar-logo">F1</span>
  <span class="toolbar-title">Points Tracker</span>
  <span class="toolbar-season" id="seasonLabel"></span>
  <div class="toolbar-right">
    <span id="status">Loading…</span>
    <select id="yearSel"></select>
    <button onclick="init()">↻ Refresh</button>
  </div>
</div>

<div class="page-body">
  <div class="drivers-panel">
    <table id="driversTbl"></table>
  </div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Constructors Championship</h2>
    </div>
    <div class="sidebar-body" id="consList"></div>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
