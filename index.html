<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Points Tracker</title>
<style>
:root {
  --red:           #e10600;
  --bg:            #ebebeb;
  --surface:       #ffffff;
  --border:        #d0d0d0;
  --text:          #1a1a1a;
  --muted:         #888;

  --sprint-hdr:    #843c0c;
  --sprint-light:  #fce4d6;
  --race-hdr:      #1f3864;
  --race-light:    #dae3f3;
  --total-hdr:     #375623;
  --total-light:   #e2efda;

  --font: 'Segoe UI', Calibri, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── toolbar ── */
.toolbar {
  background: var(--surface);
  border-top: 4px solid var(--red);
  border-bottom: 1px solid var(--border);
  padding: 0 18px;
  height: 46px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0,0,0,0.07);
}

.toolbar-logo {
  background: var(--red);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  font-style: italic;
  letter-spacing: 0.05em;
  padding: 3px 9px 3px 8px;
  border-radius: 2px;
  flex-shrink: 0;
}

.toolbar-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text);
}

.toolbar-season {
  font-size: 13px;
  color: var(--muted);
  font-weight: 400;
}

.toolbar select {
  font-family: var(--font);
  font-size: 12px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: #f8f8f8;
  color: var(--text);
  cursor: pointer;
}

.toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.toolbar button {
  font-family: var(--font);
  font-size: 12px;
  padding: 5px 14px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: #f4f4f4;
  color: var(--text);
  cursor: pointer;
  transition: background 0.12s;
}
.toolbar button:hover { background: #e8e8e8; }

/* ── info bar ── */
.infobar {
  background: #f8f8f8;
  border-bottom: 1px solid var(--border);
  padding: 3px 18px;
  font-size: 10px;
  color: var(--muted);
  flex-shrink: 0;
  display: flex;
  gap: 16px;
  align-items: center;
  min-height: 22px;
}

#status       { font-size: 11px; color: var(--text); }
#status.error { color: var(--red); font-weight: 600; }

/* ── layout ── */
.page-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.drivers-panel {
  flex: 1;
  overflow: auto;
  padding: 10px 12px;
}

/* ── constructors sidebar ── */
.sidebar {
  width: 300px;
  flex-shrink: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 12px 14px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.sidebar-header h2 {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.con-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 4px;
  border: 1px solid var(--border);
  border-left: 5px solid var(--tc, #ccc);
  background: #fafafa;
  transition: background 0.1s;
}
.con-card:hover { background: #f2f2f2; }

.con-rank {
  font-size: 18px;
  font-weight: 700;
  color: #d0d0d0;
  width: 22px;
  text-align: right;
  flex-shrink: 0;
  line-height: 1;
}

.con-info   { flex: 1; min-width: 0; }
.con-name   { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.con-max    { font-size: 10px; color: var(--muted); margin-top: 2px; }

.con-pts-wrap { text-align: right; flex-shrink: 0; }
.con-pts      { font-size: 22px; font-weight: 700; line-height: 1; color: var(--text); }
.con-label    { font-size: 9px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }

/* ── drivers table ── */
table {
  border-collapse: collapse;
  white-space: nowrap;
  font-family: var(--font);
  font-size: 12px;
  background: var(--surface);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

th, td {
  border: 1px solid #d8d8d8;
  padding: 2px 5px;
  text-align: center;
  height: 22px;
  min-width: 28px;
}

thead th { position: sticky; top: 0; z-index: 12; }
thead tr:nth-child(2) th { top: 22px; }

/* sticky left 2 cols: team + driver */
td:nth-child(1), th:nth-child(1) { position: sticky; left: 0;    z-index: 8; background: inherit; min-width: 88px;  text-align: left; }
td:nth-child(2), th:nth-child(2) { position: sticky; left: 88px; z-index: 8; background: inherit; min-width: 100px; text-align: left; }
thead th:nth-child(1), thead th:nth-child(2) { z-index: 22; }

/* group header row */
.gh th {
  height: 22px; font-size: 10px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: #fff;
}
.gh .blank { background: #d8d8d8 !important; color: transparent; }
.gh .sgrp  { background: var(--sprint-hdr) !important; }
.gh .rgrp  { background: var(--race-hdr)   !important; }
.gh .tgrp  { background: var(--total-hdr)  !important; }

/* col header row */
.ch th { font-size: 10px; font-weight: 600; line-height: 1.3; padding: 2px 4px; }
.ch .sh { background: var(--sprint-light) !important; color: var(--sprint-hdr); border-bottom: 2px solid var(--sprint-hdr); }
.ch .rh { background: var(--race-light)   !important; color: var(--race-hdr);   border-bottom: 2px solid var(--race-hdr); }
.ch .th { background: var(--total-light)  !important; color: var(--total-hdr);  border-bottom: 2px solid var(--total-hdr); font-weight: 700; }
.ch .ph { background: #f2f2f2 !important; color: var(--muted); }

/* data rows */
tbody tr { background: #fff; }
tbody tr:hover { background: #f5f9ff; }

.tc { text-align: left !important; font-size: 11px; color: #555; padding-left: 6px !important; }
.nc { text-align: left !important; font-weight: 600; font-size: 12px; padding-left: 6px !important; }

/* race point colours */
.p25 { background: #00a550 !important; color: #fff !important; font-weight: 700; }
.p18 { background: #57c789 !important; }
.p15 { background: #808080 !important; color: #fff !important; }
.p12 { background: #ffd200 !important; }
.p10 { background: #ffe566 !important; }
.p8  { background: #ffe566 !important; }
.p6  { background: #fff4a0 !important; }
.p4  { background: #fff4a0 !important; }
.p2  { background: #ffddd9 !important; }
.p1  { background: #ffddd9 !important; }

/* sprint point colours */
.s8  { background: #00a550 !important; color: #fff !important; font-weight: 700; }
.s7  { background: #57c789 !important; }
.s6  { background: #b7e4c7 !important; }
.s5  { background: #ffe566 !important; }
.s4  { background: #ffe566 !important; }
.s3  { background: #fff4a0 !important; }
.s2c { background: #ffddd9 !important; }
.s1c { background: #ffddd9 !important; }

.future    { background: #fafafa !important; color: transparent; }
.cancelled { background: #f0f0f0 !important; color: #bbb; font-size: 9px; font-style: italic; }
.totcell   { background: var(--total-light) !important; font-weight: 700; color: var(--total-hdr); min-width: 52px; }
.poscell   { background: #f8f8f8 !important; color: var(--muted); font-size: 11px; min-width: 52px; }

/* widen data cells to fill screen */
.sprint-td { min-width: 38px; }
.race-td   { min-width: 38px; }
</style>
</head>
<body>

<div class="toolbar">
  <span class="toolbar-logo">F1</span>
  <span class="toolbar-title">Points Tracker</span>
  <span class="toolbar-season" id="seasonLabel"></span>
  <div class="toolbar-right">
    <select id="yearSel"></select>
    <button onclick="init()">↻ Refresh</button>
  </div>
</div>

<div class="infobar">
  <span id="status">Loading…</span>
  <span id="lastUpdated"></span>
</div>

<div class="page-body">
  <div class="drivers-panel">
    <table id="driversTbl"></table>
  </div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Constructors Championship</h2>
    </div>
    <div class="sidebar-body" id="consList"></div>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
