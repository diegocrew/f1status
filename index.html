<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Points Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --red:    #e10600;
  --dark:   #15151e;
  --bg:     #f0f0f0;
  --card:   #ffffff;
  --border: #e0e0e0;
  --text:   #15151e;
  --muted:  #888;
  --sprint-accent: #c94a0a;
  --race-accent:   #15151e;
  --total-accent:  #1b5e20;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Titillium Web', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── header ── */
.site-header {
  background: var(--dark);
  color: #fff;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  flex-shrink: 0;
  border-bottom: 3px solid var(--red);
}

.f1-badge {
  background: var(--red);
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  font-style: italic;
  letter-spacing: 0.05em;
  padding: 2px 9px;
  border-radius: 2px;
}

.site-header h1 {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.site-header select {
  font-family: inherit;
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 3px;
  border: 1px solid #444;
  background: #2a2a3a;
  color: #fff;
  cursor: pointer;
  margin-left: auto;
}

.site-header button {
  font-family: inherit;
  font-size: 13px;
  padding: 4px 12px;
  border-radius: 3px;
  border: 1px solid #e10600;
  background: transparent;
  color: #fff;
  cursor: pointer;
  transition: background 0.15s;
}
.site-header button:hover { background: #e10600; }

/* ── sub-header ── */
.sub-header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 4px 16px;
  font-size: 11px;
  color: var(--muted);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: 26px;
}

#status { font-size: 12px; color: var(--text); }
#status.error { color: var(--red); font-weight: 600; }

/* ── body ── */
.page-body {
  display: flex;
  flex: 1;
  overflow: hidden;
  gap: 0;
}

/* ── drivers panel ── */
.drivers-panel {
  flex: 1;
  overflow: auto;
  padding: 10px;
}

/* ── constructors panel ── */
.constructors-panel {
  width: 280px;
  flex-shrink: 0;
  overflow-y: auto;
  background: var(--card);
  border-left: 1px solid var(--border);
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.constructors-panel .panel-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 2px solid var(--red);
  padding-bottom: 6px;
  margin-bottom: 2px;
}

.con-row {
  display: flex;
  align-items: center;
  background: #fafafa;
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-left: 5px solid var(--tc, #ccc);
  gap: 8px;
  padding: 6px 10px 6px 8px;
}

.con-rank {
  font-size: 17px;
  font-weight: 700;
  color: #ccc;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}

.con-info { flex: 1; min-width: 0; }

.con-name {
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.con-possible {
  font-size: 10px;
  color: var(--muted);
  margin-top: 1px;
}

.con-pts {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  flex-shrink: 0;
  text-align: right;
}

/* ── table ── */
table {
  border-collapse: collapse;
  white-space: nowrap;
  font-family: 'Titillium Web', Arial, sans-serif;
  font-size: 12px;
  background: var(--card);
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

th, td {
  border: 1px solid #e8e8e8;
  padding: 2px 6px;
  text-align: center;
  height: 22px;
  min-width: 28px;
}

/* sticky headers */
thead th { position: sticky; top: 0; z-index: 12; }
thead tr:nth-child(2) th { top: 22px; }

/* sticky left cols */
td:nth-child(1), th:nth-child(1) { position: sticky; left: 0;     z-index: 8; background: inherit; min-width: 20px; max-width: 20px; }
td:nth-child(2), th:nth-child(2) { position: sticky; left: 20px;  z-index: 8; background: inherit; min-width: 82px; text-align: left; }
td:nth-child(3), th:nth-child(3) { position: sticky; left: 102px; z-index: 8; background: inherit; min-width: 90px; text-align: left; }
thead th:nth-child(1), thead th:nth-child(2), thead th:nth-child(3) { z-index: 22; }

/* group header row */
.gh th {
  height: 22px; font-size: 10px; font-weight: 700;
  letter-spacing: 0.07em; text-transform: uppercase; color: #fff;
}
.gh .blank { background: #e0e0e0 !important; color: transparent; }
.gh .sgrp  { background: var(--sprint-accent) !important; }
.gh .rgrp  { background: var(--race-accent) !important; }
.gh .tgrp  { background: var(--total-accent) !important; }

/* col header row */
.ch th { font-size: 10px; font-weight: 600; line-height: 1.3; padding: 2px 3px; background: #f8f8f8; }
.ch .sh { background: #fff2ea !important; color: var(--sprint-accent); border-bottom: 2px solid var(--sprint-accent); }
.ch .rh { background: #f0f0f0 !important; color: #444; }
.ch .th { background: #edf7ee !important; color: var(--total-accent); font-weight: 700; border-bottom: 2px solid var(--total-accent); }
.ch .ph { background: #f8f8f8 !important; color: var(--muted); }

/* data rows */
tbody tr { background: #fff; }
tbody tr:hover { background: #f9f9f9; }

.sc   { font-size: 10px; color: #ccc; padding: 0 2px; }
.sc.s1 { color: #aaa; font-weight: 700; }
.sc.s2 { color: #ddd; }

.tc {
  text-align: left !important; font-size: 10px; color: #666;
  padding-left: 7px !important;
}

.nc {
  text-align: left !important; font-weight: 600; font-size: 12px;
  padding-left: 6px !important;
}

/* point colours */
.p25 { background: #00a550 !important; color: #fff !important; font-weight: 700; }
.p18 { background: #57c789 !important; }
.p15 { background: #808080 !important; color: #fff !important; }
.p12 { background: #ffd200 !important; }
.p10 { background: #ffe566 !important; }
.p8  { background: #ffe566 !important; }
.p6  { background: #fff4a0 !important; }
.p4  { background: #fff4a0 !important; }
.p2  { background: #ffddd9 !important; }
.p1  { background: #ffddd9 !important; }

/* sprint point colours */
.s8  { background: #00a550 !important; color: #fff !important; font-weight: 700; }
.s7  { background: #57c789 !important; }
.s6  { background: #b7e4c7 !important; }
.s5  { background: #ffe566 !important; }
.s4  { background: #ffe566 !important; }
.s3  { background: #fff4a0 !important; }
.s2c { background: #ffddd9 !important; }
.s1c { background: #ffddd9 !important; }

.future    { background: #fafafa !important; color: transparent; }
.cancelled { background: #f0f0f0 !important; color: #bbb; font-size: 9px; font-style: italic; }
.totcell   { background: #edf7ee !important; font-weight: 700; color: #1b5e20; }
.poscell   { background: #fafafa !important; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>

<header class="site-header">
  <span class="f1-badge">F1</span>
  <h1>Points Tracker</h1>
  <select id="yearSel"></select>
  <button onclick="init()">↻ Refresh</button>
</header>

<div class="sub-header">
  <span id="status">Loading…</span>
  <span id="lastUpdated"></span>
</div>

<div class="page-body">
  <div class="drivers-panel">
    <table id="driversTbl"></table>
  </div>

  <aside class="constructors-panel" id="conPanel">
    <div class="panel-title">Constructors Championship</div>
    <div id="consList"></div>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
